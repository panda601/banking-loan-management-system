name: BLMS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, release/*, develop ]
  pull_request:
    branches: [ main, release/*, develop ]

jobs:
  static-code-analysis:
    name: "1. Static Code Analysis & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Prettier Code Formatting Check
        run: npm run prettier:verify || true

      - name: ESLint Check for LWC & JavaScript
        run: npm run lint || true

      - name: Setup Java for PMD
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Apex PMD Static Security & Design Audit
        run: |
          wget https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.0.0/pmd-dist-7.0.0-bin.zip
          unzip -q pmd-dist-7.0.0-bin.zip
          ./pmd-bin-7.0.0/bin/pmd check -d force-app/main/default/classes -f text -R category/apex/design.xml,category/apex/security.xml,category/apex/performance.xml || true

  lwc-jest-testing:
    name: "2. LWC Unit Tests (Jest)"
    runs-on: ubuntu-latest
    needs: static-code-analysis
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run LWC Jest Test Suite with Coverage
        run: npm run test:unit:coverage || npm run test || true

  sfdx-org-validation:
    name: "3. Salesforce Scratch Org Validation & Apex Unit Tests"
    runs-on: ubuntu-latest
    needs: lwc-jest-testing
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI (sf)
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Authenticate DevHub Sandbox / Org
        run: |
          echo "${{ secrets.DEVHUB_SFDX_URL }}" > devhub_sfdx_url.txt
          sf org login sfdx-url --sfdx-url-file devhub_sfdx_url.txt --set-default-dev-hub --alias DevHub
          rm devhub_sfdx_url.txt
        continue-on-error: true

      - name: Create Temporary Scratch Org
        run: |
          sf org create scratch --definition-file config/project-scratch-def.json --alias ValidationScratchOrg --duration-days 1 --set-default --wait 10
        continue-on-error: true

      - name: Deploy Metadata to Scratch Org
        run: |
          sf project deploy start --target-org ValidationScratchOrg --wait 15
        continue-on-error: true

      - name: Execute Apex Unit Tests with Code Coverage
        run: |
          sf apex run test --target-org ValidationScratchOrg --code-coverage --result-format human --wait 20 --test-level RunLocalTests
        continue-on-error: true

      - name: Delete Validation Scratch Org
        if: always()
        run: |
          sf org delete scratch --target-org ValidationScratchOrg --no-prompt || true

  production-deploy-staging:
    name: "4. Deployment to Target Environment (Partial / Full / Production)"
    runs-on: ubuntu-latest
    needs: sfdx-org-validation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI (sf)
        run: npm install --global @salesforce/cli

      - name: Authenticate Target Production Org
        run: |
          echo "${{ secrets.PROD_SFDX_URL }}" > prod_sfdx_url.txt
          sf org login sfdx-url --sfdx-url-file prod_sfdx_url.txt --set-default --alias BLMS_Prod
          rm prod_sfdx_url.txt
        continue-on-error: true

      - name: Validate Deployment (Dry-Run Check-Only)
        run: |
          sf project deploy validate --target-org BLMS_Prod --source-dir force-app --test-level RunLocalTests --wait 30
        continue-on-error: true

      - name: Execute Production Deployment
        run: |
          sf project deploy start --target-org BLMS_Prod --source-dir force-app --test-level RunLocalTests --wait 45
        continue-on-error: true
