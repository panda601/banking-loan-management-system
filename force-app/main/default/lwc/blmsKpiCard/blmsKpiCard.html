<template>
    <div class="slds-card slds-p-around_medium blms-kpi-card">
        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
            <div class="slds-media slds-media_center">
                <div class="slds-media__figure icon-container">
                    <lightning-icon icon-name={iconName} size="small" variant={iconVariant}></lightning-icon>
                </div>
                <div class="slds-media__body slds-m-left_small">
                    <p class="kpi-title slds-truncate" title={title}>{title}</p>
                    <h3 class="kpi-value slds-m-top_xx-small">{formattedValue}</h3>
                </div>
            </div>
            <template if:true={trendValue}>
                <span class={trendClass}>
                    <lightning-icon icon-name={trendIcon} size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                    {trendValue}
                </span>
            </template>
        </div>
    </div>
</template>
