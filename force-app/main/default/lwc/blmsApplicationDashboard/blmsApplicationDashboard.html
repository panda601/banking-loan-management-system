<template>
    <div class="blms-dashboard-wrapper slds-p-around_medium">
        
        <!-- MODULAR HEADER -->
        <c-dashboard-header 
            user-name={userName}
            onrefresh={handleRefresh}
            onnewapplication={handleNewApp}>
        </c-dashboard-header>

        <!-- MAIN LAYOUT GRID (Main Content 9-of-12 + Sidebar 3-of-12) -->
        <div class="slds-grid slds-gutters slds-wrap">
            
            <!-- LEFT MAIN CONTENT (9-of-12) -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_9-of-12">
                
                <!-- KPI CARDS -->
                <div class="slds-m-bottom_medium">
                    <div class="slds-grid slds-gutters slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
                            <c-blms-kpi-card title="Total Applications" value={kpis.totalApplications} icon-name="standard:avatar" trend-value="+8.4%" trend-direction="up"></c-blms-kpi-card>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
                            <c-blms-kpi-card title="Pending Approvals" value={kpis.pendingApproval} icon-name="standard:approval" trend-value="-3.2%" trend-direction="down"></c-blms-kpi-card>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
                            <c-blms-kpi-card title="Disbursed Loans" value={kpis.disbursedCount} icon-name="standard:dashboard" trend-value="+12.1%" trend-direction="up"></c-blms-kpi-card>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
                            <c-blms-kpi-card title="Total Volume" value={kpis.totalVolume} type="currency" icon-name="standard:currency" trend-value="+15.0%" trend-direction="up"></c-blms-kpi-card>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
                            <c-blms-kpi-card title="Defaulted Loans" value={kpis.defaultedCount} icon-name="standard:warning" trend-value="-2.5%" trend-direction="down"></c-blms-kpi-card>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_small">
                            <c-blms-kpi-card title="Approval Rate" value={kpis.approvalRate} icon-name="standard:investment_account" trend-value="+4.2%" trend-direction="up"></c-blms-kpi-card>
                        </div>
                    </div>
                </div>

                <!-- QUICK ACTIONS OPERATIONAL PANEL -->
                <div class="slds-m-bottom_medium">
                    <c-quick-actions-panel
                        onnewapp={handleNewApp}
                        onnewcustomer={handleNewCustomer}
                        onverifydocs={handleDocVerification}
                        oncollectemi={handleCollectEMI}
                        onviewapprovals={handleViewApprovals}
                        onopenreports={handleOpenReports}>
                    </c-quick-actions-panel>
                </div>

                <!-- CHARTS & STAGE DISTRIBUTION -->
                <div class="slds-m-bottom_medium">
                    <c-dashboard-charts pipeline-data={pipelineSummary}></c-dashboard-charts>
                </div>

                <!-- ACTIVE APPLICATIONS PIPELINE TABLE -->
                <div class="slds-m-bottom_medium">
                    <c-dashboard-pipeline raw-applications={rawApplications} onselectrecord={handleSelectRecord}></c-dashboard-pipeline>
                </div>

                <!-- COLLAPSIBLE LOAN ELIGIBILITY CALCULATOR -->
                <div class="slds-m-bottom_medium">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                        <h2 class="section-heading">Loan Eligibility & Scenario Calculator</h2>
                        <lightning-button 
                            label={calcToggleLabel} 
                            icon-name={calcToggleIcon} 
                            variant="neutral" 
                            size="small" 
                            onclick={toggleCalculator}>
                        </lightning-button>
                    </div>
                    <template if:true={showCalculator}>
                        <c-blms-eligibility-calculator></c-blms-eligibility-calculator>
                    </template>
                </div>

                <!-- WORK QUEUE TASKS -->
                <div class="slds-m-bottom_medium">
                    <c-dashboard-tasks raw-tasks={pendingTasks} onopentask={handleOpenTask}></c-dashboard-tasks>
                </div>

            </div>

            <!-- RIGHT SIDEBAR (3-of-12) -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_3-of-12">
                
                <!-- OPERATIONAL NOTIFICATIONS PANEL -->
                <div class="slds-m-bottom_medium">
                    <c-dashboard-notifications notifications={notifications}></c-dashboard-notifications>
                </div>

                <!-- RECENT ACTIVITIES TIMELINE -->
                <div class="slds-m-bottom_medium">
                    <c-dashboard-activities activities={activities}></c-dashboard-activities>
                </div>

            </div>

        </div>
    </div>
</template>
